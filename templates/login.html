
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Component System | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <h2>Smart Component System</h2>
        <p class="text-muted">Sign in to manage component access</p>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label class="form-label" for="username">Username</label>
            <input class="form-control mb-3" id="username"
                   name="username" required autocomplete="username">

            <label class="form-label" for="password">Password</label>
            <input class="form-control mb-3" id="password"
                   type="password" name="password" required
                   autocomplete="current-password">

            <button class="btn btn-primary w-100" type="submit">
                Login
            </button>
        </form>

        <p class="small text-muted mt-3 mb-0">
            Authorized users only
        </p>
        <p class="mt-3 mb-0">New student or faculty? <a href="{{ url_for('signup') }}">Sign up</a></p>
    </div>
</body>
</html>
