
{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Component</h2>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Component Name</label>
            <input type="text" name="name" class="form-control"
                   value="{{ component.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Part Number</label>
            <input type="text" name="part_number" class="form-control"
                   value="{{ component.part_number }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control"
                   value="{{ component.category }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity" class="form-control"
                   value="{{ component.quantity }}" min="0" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control"
                   value="{{ component.location }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control"
                      rows="3">{{ component.description or '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('inventory') }}"
           class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
